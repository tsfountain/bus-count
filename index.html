<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bus Count">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Bus Count</title>
<style>
  :root {
    --bg:#f2f4f8; --card:#ffffff; --text:#14181f; --muted:#5b6575; --line:#dde2ea;
    --accent:#1d4ed8; --accent-text:#ffffff; --danger:#b91c1c; --total:#e8f0ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#9aa5b4; --line:#2b333d;
            --accent:#4c8dff; --accent-text:#0b1220; --danger:#ff7b72; --total:#17233a; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left);
  }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 14px; }
  h2 { font-size:16px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
  .grid > * { min-width:0; }
  .full { grid-column:1 / -1; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  input[type=date], input[type=time], input[type=number], input[type=text] {
    width:100%; min-width:0; max-width:100%; font-size:16px; padding:11px 10px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); min-height:46px;
    -webkit-appearance:none; appearance:none;
  }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row > div { flex:1; min-width:0; }
  .row > button { flex:0 0 auto; min-height:46px; }
  button {
    font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--text); padding:11px 14px; min-height:46px; cursor:pointer;
  }
  button.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  button.small { min-height:38px; padding:6px 12px; font-size:14px; }
  button.danger { color:var(--danger); }
  button.now-start { background:#16a34a; border-color:#16a34a; color:#fff; }
  button.now-stop { background:#dc2626; border-color:#dc2626; color:#fff; }
  button:active { opacity:.7; }
  .total-box { background:var(--total); border-radius:10px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; }
  .total-box span:last-child { font-size:24px; font-weight:700; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .actions > button { flex:1; }
  .err { color:var(--danger); font-size:14px; margin-top:8px; min-height:1px; }
  .summary { color:var(--muted); font-size:14px; margin-bottom:10px; }
  .entry { border-top:1px solid var(--line); padding:10px 0; }
  .entry:first-child { border-top:none; }
  .entry .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .entry .date { font-weight:700; }
  .entry .times { color:var(--muted); font-size:14px; }
  .entry .nums { display:flex; gap:14px; margin:6px 0; font-size:15px; }
  .entry .nums b { font-weight:700; }
  .entry .btns { display:flex; gap:8px; }
  .empty { color:var(--muted); text-align:center; padding:18px 0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px 3px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; }
  tfoot td { white-space:normal; }
  tfoot td { font-weight:700; border-top:2px solid var(--text); border-bottom:none; }
  .report-head { margin-bottom:12px; }
  .report-head .t { font-size:20px; font-weight:700; }
  .report-head .m { color:var(--muted); font-size:14px; }
  .banner { background:#fff7e0; color:#4a3500; border:1px solid #f0c75e; border-radius:14px; padding:14px; margin-bottom:14px; }
  .banner .actions { margin-top:10px; }
  @media (prefers-color-scheme: dark) { .banner { background:#3a2e08; color:#ffe9a8; border-color:#7a6014; } }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 20px); transform:translateX(-50%);
    background:#111; color:#fff; padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; }
  .toast.show { opacity:.95; }
  [hidden] { display:none !important; }
  @media print {
    body { background:#fff; color:#000; padding:0; }
    .no-print { display:none !important; }
    .card { border:none; padding:0; }
    th, td { border-bottom:1px solid #999; color:#000; }
    th { color:#333; }
    .report-head .m { color:#333; }
    tfoot td { border-top:2px solid #000; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== MAIN VIEW ===== -->
  <div id="view-main">
    <h1>Bus Count</h1>

    <div class="banner no-print" id="backup-banner" role="status" hidden>
      <div><b>Time for your weekly backup.</b> Export your counts so they are saved outside this phone.</div>
      <div class="actions">
        <button type="button" class="primary small" id="btn-banner-export">Export CSV now</button>
        <button type="button" class="small" id="btn-banner-later">Later</button>
      </div>
    </div>

    <form id="form" class="card" autocomplete="off">
      <h2 id="form-title">New entry</h2>
      <div class="grid">
        <div class="full">
          <label for="f-date">Date</label>
          <input id="f-date" type="date" required>
        </div>
        <div class="full">
          <label for="f-start">Start time</label>
          <div class="row">
            <div><input id="f-start" type="time" required></div>
            <button type="button" class="small now-start" data-now="f-start">Now</button>
          </div>
        </div>
        <div class="full">
          <label for="f-stop">Stop time</label>
          <div class="row">
            <div><input id="f-stop" type="time" required></div>
            <button type="button" class="small now-stop" data-now="f-stop">Now</button>
          </div>
        </div>
        <div>
          <label for="f-c1">Cole</label>
          <input id="f-c1" type="number" inputmode="numeric" min="0" step="1" placeholder="0" required>
        </div>
        <div>
          <label for="f-c2">Spofford</label>
          <input id="f-c2" type="number" inputmode="numeric" min="0" step="1" placeholder="0" required>
        </div>
        <div class="full total-box"><span>Total (Cole + Spofford)</span><span id="f-total">0</span></div>
      </div>
      <div class="err" id="err" role="alert"></div>
      <div class="actions" style="margin-top:12px">
        <button type="submit" class="primary" id="btn-save">Save entry</button>
        <button type="button" id="btn-cancel" hidden>Cancel edit</button>
      </div>
    </form>

    <div class="card">
      <h2>Entries</h2>
      <div class="summary" id="summary"></div>
      <div class="summary" id="backup-info"></div>
      <div id="list"></div>
      <div class="actions" style="margin-top:12px">
        <button type="button" id="btn-csv">Export CSV</button>
        <button type="button" id="btn-report">Report</button>
      </div>
    </div>
  </div>

  <!-- ===== REPORT VIEW ===== -->
  <div id="view-report" hidden>
    <div class="no-print">
      <h1>Report</h1>
      <div class="card">
        <div class="grid">
          <div class="full">
            <label for="r-title">Report title (optional, e.g. route or program name)</label>
            <input id="r-title" type="text" placeholder="Bus rider count report">
          </div>
          <div>
            <label for="r-from">From</label>
            <input id="r-from" type="date">
          </div>
          <div>
            <label for="r-to">To</label>
            <input id="r-to" type="date">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="report-head">
        <div class="t" id="r-head-title">Bus rider count report</div>
        <div class="m" id="r-head-meta"></div>
      </div>
      <div id="r-table"></div>
    </div>

    <div class="actions no-print">
      <button type="button" class="primary" id="btn-print">Print / PDF</button>
      <button type="button" id="btn-report-csv">Export CSV</button>
      <button type="button" id="btn-back">Back</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'buscount.v1';
  const TITLE_KEY = 'buscount.title';
  const BACKUP_KEY = 'buscount.lastBackup';
  let bannerDismissed = false;
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2, '0');

  let entries = load();
  let editingId = null;

  /* ---------- storage ---------- */
  function load() {
    try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(entries)); return true; }
    catch (e) { toast('Could not save. Is private browsing on?'); return false; }
  }

  /* ---------- helpers ---------- */
  function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function nowTime() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function total(e) { return (Number(e.c1) || 0) + (Number(e.c2) || 0); }
  function fmtDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric', year:'numeric' });
  }
  function fmtShort(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { year:'2-digit', month:'numeric', day:'numeric' });
  }
  function fmtTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    const ap = h >= 12 ? 'PM' : 'AM';
    return `${((h + 11) % 12) + 1}:${pad(m)} ${ap}`;
  }
  function sorted(list, dir) {
    const k = e => e.date + ' ' + e.start;
    return list.slice().sort((a, b) => dir * (k(a) < k(b) ? -1 : k(a) > k(b) ? 1 : 0));
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------- form ---------- */
  function updateTotal() {
    $('#f-total').textContent = (Number($('#f-c1').value) || 0) + (Number($('#f-c2').value) || 0);
  }
  function resetForm() {
    editingId = null;
    $('#form-title').textContent = 'New entry';
    $('#btn-save').textContent = 'Save entry';
    $('#btn-cancel').hidden = true;
    $('#f-date').value = todayStr();
    $('#f-start').value = '';
    $('#f-stop').value = '';
    $('#f-c1').value = '';
    $('#f-c2').value = '';
    $('#err').textContent = '';
    updateTotal();
  }
  function startEdit(id) {
    const e = entries.find(x => x.id === id); if (!e) return;
    editingId = id;
    $('#form-title').textContent = 'Edit entry';
    $('#btn-save').textContent = 'Update entry';
    $('#btn-cancel').hidden = false;
    $('#f-date').value = e.date; $('#f-start').value = e.start; $('#f-stop').value = e.stop;
    $('#f-c1').value = e.c1; $('#f-c2').value = e.c2;
    $('#err').textContent = '';
    updateTotal();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function onSubmit(ev) {
    ev.preventDefault();
    const rec = {
      date: $('#f-date').value, start: $('#f-start').value, stop: $('#f-stop').value,
      c1: parseInt($('#f-c1').value, 10), c2: parseInt($('#f-c2').value, 10)
    };
    if (!rec.date || !rec.start || !rec.stop) return ($('#err').textContent = 'Enter a date, start time and stop time.');
    if (!(rec.c1 >= 0) || !(rec.c2 >= 0)) return ($('#err').textContent = 'Counts must be whole numbers, 0 or more.');
    if (rec.stop < rec.start) return ($('#err').textContent = 'Stop time is earlier than start time.');
    if (editingId) {
      const i = entries.findIndex(x => x.id === editingId);
      if (i >= 0) entries[i] = { id: editingId, ...rec };
    } else {
      entries.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...rec });
    }
    if (!persist()) return;
    toast(editingId ? 'Entry updated' : 'Entry saved');
    resetForm();
    render();
  }

  /* ---------- list ---------- */
  function render() {
    const list = $('#list');
    const sum = entries.reduce((a, e) => ({ c1: a.c1 + e.c1, c2: a.c2 + e.c2 }), { c1: 0, c2: 0 });
    $('#summary').textContent = entries.length
      ? `${entries.length} entr${entries.length === 1 ? 'y' : 'ies'} · Cole: ${sum.c1} · Spofford: ${sum.c2} · Total: ${sum.c1 + sum.c2}`
      : '';
    const lb = lastBackup();
    $('#backup-info').textContent = entries.length ? (lb ? `Last backup: ${fmtDate(lb)}` : 'No backup exported yet.') : '';
    updateBanner();
    if (!entries.length) { list.innerHTML = '<div class="empty">No entries yet.</div>'; return; }
    list.innerHTML = sorted(entries, -1).map(e => `
      <div class="entry">
        <div class="top"><span class="date">${esc(fmtDate(e.date))}</span><span class="times">${esc(fmtTime(e.start))} – ${esc(fmtTime(e.stop))}</span></div>
        <div class="nums"><span>Cole: <b>${e.c1}</b></span><span>Spofford: <b>${e.c2}</b></span><span>Total: <b>${total(e)}</b></span></div>
        <div class="btns">
          <button class="small" data-edit="${e.id}">Edit</button>
          <button class="small danger" data-del="${e.id}">Delete</button>
        </div>
      </div>`).join('');
  }
  function onListClick(ev) {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.edit) startEdit(b.dataset.edit);
    if (b.dataset.del) {
      const e = entries.find(x => x.id === b.dataset.del);
      if (e && confirm(`Delete the entry for ${fmtDate(e.date)} starting ${fmtTime(e.start)}?`)) {
        entries = entries.filter(x => x.id !== e.id);
        if (editingId === e.id) resetForm();
        persist(); render();
      }
    }
  }

  /* ---------- CSV ---------- */
  function csvCell(v) { const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function buildCsv(list) {
    const rows = [['Date', 'Start Time', 'Stop Time', 'Cole', 'Spofford', 'Total Riders']];
    sorted(list, 1).forEach(e => rows.push([e.date, e.start, e.stop, e.c1, e.c2, total(e)]));
    return rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
  }
  // isBackup = true for a full export of all entries; that is what resets the weekly reminder.
  async function exportCsv(list, isBackup) {
    if (!list.length) return toast('Nothing to export yet');
    const name = `bus-count-${todayStr()}.csv`;
    const csv = buildCsv(list);
    const done = () => { if (isBackup) markBackup(); };
    try {
      const file = new File([csv], name, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        done();
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    done();
  }

  /* ---------- weekly backup reminder (Fridays after noon) ---------- */
  function lastBackup() { try { return localStorage.getItem(BACKUP_KEY) || ''; } catch (e) { return ''; } }
  function markBackup() {
    try { localStorage.setItem(BACKUP_KEY, todayStr()); } catch (e) {}
    render();
    toast('Backup saved');
  }
  function backupDue() {
    const now = new Date();
    return now.getDay() === 5 && now.getHours() >= 12 && entries.length > 0 &&
           lastBackup() !== todayStr() && !bannerDismissed;
  }
  function updateBanner() { $('#backup-banner').hidden = !backupDue(); }

  /* ---------- report ---------- */
  function reportRows() {
    const from = $('#r-from').value, to = $('#r-to').value;
    return sorted(entries.filter(e => (!from || e.date >= from) && (!to || e.date <= to)), 1);
  }
  function renderReport() {
    const rows = reportRows();
    const title = $('#r-title').value.trim() || 'Bus rider count report';
    $('#r-head-title').textContent = title;
    const from = $('#r-from').value, to = $('#r-to').value;
    const range = from || to ? `${from ? fmtDate(from) : 'start'} to ${to ? fmtDate(to) : 'present'}` : 'All dates';
    $('#r-head-meta').textContent = `${range} · Generated ${new Date().toLocaleDateString()}`;
    if (!rows.length) { $('#r-table').innerHTML = '<div class="empty">No entries in this range.</div>'; return; }
    const s1 = rows.reduce((a, e) => a + e.c1, 0), s2 = rows.reduce((a, e) => a + e.c2, 0);
    $('#r-table').innerHTML = `
      <table>
        <thead><tr><th>Date</th><th>Start</th><th>Stop</th><th>Cole</th><th>Spofford</th><th>Total</th></tr></thead>
        <tbody>${rows.map(e => `<tr><td>${esc(fmtShort(e.date))}</td><td>${esc(fmtTime(e.start))}</td><td>${esc(fmtTime(e.stop))}</td><td>${e.c1}</td><td>${e.c2}</td><td>${total(e)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="3">Totals (${rows.length} entr${rows.length === 1 ? 'y' : 'ies'})</td><td>${s1}</td><td>${s2}</td><td>${s1 + s2}</td></tr></tfoot>
      </table>`;
  }
  function openReport() {
    if (!entries.length) return toast('Add some entries first');
    const dates = entries.map(e => e.date).sort();
    $('#r-from').value = dates[0]; $('#r-to').value = dates[dates.length - 1];
    try { $('#r-title').value = localStorage.getItem(TITLE_KEY) || ''; } catch (e) {}
    $('#view-main').hidden = true; $('#view-report').hidden = false;
    window.scrollTo(0, 0);
    renderReport();
  }
  function closeReport() { $('#view-report').hidden = true; $('#view-main').hidden = false; window.scrollTo(0, 0); }

  /* ---------- wire up ---------- */
  $('#form').addEventListener('submit', onSubmit);
  $('#f-c1').addEventListener('input', updateTotal);
  $('#f-c2').addEventListener('input', updateTotal);
  $('#btn-cancel').addEventListener('click', resetForm);
  document.querySelectorAll('[data-now]').forEach(b => b.addEventListener('click', () => { $('#' + b.dataset.now).value = nowTime(); }));
  $('#list').addEventListener('click', onListClick);
  $('#btn-csv').addEventListener('click', () => exportCsv(entries, true));
  $('#btn-banner-export').addEventListener('click', () => exportCsv(entries, true));
  $('#btn-banner-later').addEventListener('click', () => { bannerDismissed = true; updateBanner(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) updateBanner(); });
  $('#btn-report').addEventListener('click', openReport);
  $('#btn-back').addEventListener('click', closeReport);
  $('#btn-print').addEventListener('click', () => window.print());
  $('#btn-report-csv').addEventListener('click', () => exportCsv(reportRows()));
  $('#r-from').addEventListener('change', renderReport);
  $('#r-to').addEventListener('change', renderReport);
  $('#r-title').addEventListener('input', () => {
    try { localStorage.setItem(TITLE_KEY, $('#r-title').value); } catch (e) {}
    renderReport();
  });

  resetForm();
  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
})();
</script>
</body>
</html>
